# Production-like окружение: Nginx + PHP-FPM 8.3 (лимит RAM 256MB), SQLite в volume.
# Запуск: cp .env.example .env && (заполнить APP_KEY и ключи) && docker compose up -d --build
services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/data/database.sqlite
    volumes:
      - sqlite:/var/www/html/database/data
      - storage:/var/www/html/storage
    mem_limit: 256m
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - app
    ports:
      - "${MICROCROP_HTTP_PORT:-8080}:80"
    mem_limit: 64m
    restart: unless-stopped

volumes:
  sqlite:
  storage:
